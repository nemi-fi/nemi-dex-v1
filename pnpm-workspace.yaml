packages:
  - apps/*
  - packages/*
  - scripts

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  core-js-pure: false
  esbuild: false
  leveldown: false
  lmdb: false
  msgpackr-extract: false
  protobufjs: false
  workerd: true

catalog:
  '@aztec-foundation/aztec-standards': 6.0.0
  '@aztec-labs/accounts': 6.0.0
  '@aztec-labs/aztec.js': 6.0.0
  '@aztec-labs/constants': 6.0.0
  '@aztec-labs/ethereum': 6.0.0
  '@aztec-labs/foundation': 6.0.0
  '@aztec-labs/noir-contracts.js': 6.0.0
  '@aztec-labs/pxe': 6.0.0
  '@aztec-labs/stdlib': 6.0.0
  '@aztec-labs/wallet-sdk': 6.0.0
  '@aztec-labs/wallets': 6.0.0
  '@types/lodash-es': ^4.17.12
  '@types/ms': ^2.1.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@uniswap/sdk-core': ^7.10.0
  dotenv: ^18.0.5
  gaztec: 1.4.2
  json-stringify-deterministic: 1.0.16
  lodash-es: ^4.18.1
  ms: ^2.1.3
  ox: ^0.14.53
  prettier: ^3.9.9
  react: 19.3.0
  react-dom: 19.3.0
  svelte: ^5.57.1
  ts-essentials: ^10.2.1
  tsx: ^4.23.15
  typescript: ^7.0.2
  viem: ^2.57.2
  vite: ^8.3.4
  vitest: ^5.0.3
  zod: ^4.4.3

verifyDepsBeforeRun: install

# Only install versions published at least one week ago
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@aztec-labs/*'
  - '@aztec-foundation/*'
