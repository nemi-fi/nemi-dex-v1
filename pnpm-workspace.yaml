packages:
  - apps/*
  - packages/*
  - scripts

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  core-js-pure: false
  esbuild: false
  leveldown: false
  lmdb: false
  msgpackr-extract: false
  protobufjs: false

catalog:
  '@aztec-foundation/aztec-standards': 5.1.0-rc.1
  '@aztec/accounts': 5.1.0
  '@aztec/aztec.js': 5.1.0
  '@aztec/bb.js': 5.1.0
  '@aztec/constants': 5.1.0
  '@aztec/ethereum': 5.1.0
  '@aztec/foundation': 5.1.0
  '@aztec/noir-contracts.js': 5.1.0
  '@aztec/noir-noir_js': 5.1.0
  '@aztec/protocol-contracts': 5.1.0
  '@aztec/sqlite3mc-wasm': 5.1.0
  '@aztec/pxe': 5.1.0
  '@aztec/stdlib': 5.1.0
  '@aztec/wallet-sdk': 5.1.0
  '@aztec/wallets': 5.1.0
  '@noble/curves': ^2.4.0
  '@types/lodash-es': ^4.17.12
  '@types/ms': ^2.1.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@uniswap/sdk-core': ^7.10.0
  dotenv: ^18.0.5
  gaztec: 1.4.2
  json-stringify-deterministic: 1.0.16
  ky: ^2.1.0
  lodash-es: ^4.18.1
  ms: ^2.1.3
  ox: ^0.14.53
  prettier: ^3.9.9
  react: 19.3.0
  react-dom: 19.3.0
  svelte: ^5.57.1
  ts-essentials: ^10.2.1
  tsx: ^4.23.15
  typescript: ^7.0.2
  viem: ^2.57.2
  vite: ^8.3.2
  vitest: ^5.0.3
  zod: ^4.4.3
  zod-openapi: ^6.0.2

overrides:
  # @vercel/analytics lists @sveltejs/kit as an optional peer; pnpm installs it,
  # which drags in an old vite@6 we don't use (this is a Next.js app)
  '@vercel/analytics>@sveltejs/kit': '-'

patchedDependencies:
  '@aztec/sqlite3mc-wasm@5.1.0': patches/@aztec__sqlite3mc-wasm@5.1.0.patch

verifyDepsBeforeRun: install

# Only install versions published at least one week ago
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # our own package, released alongside this change
  - gaztec@1.4.2
